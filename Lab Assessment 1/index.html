<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Tracking Web App</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Include OpenCV.js and Three.js -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body style="margin : 0px; overflow: hidden; background-color: #000;">

    <!-- UI Overlay for the required buttons -->
    <div id="ui-container">
        <h1>AR Feature Tracking (Custom OpenCV Engine)</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="imageUpload" class="custom-btn">Upload Image</label>
                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            </div>
            
            <button id="generateBtn" class="custom-btn">Generate Features</button>
            <button id="saveBtn" class="custom-btn disabled" disabled>Save Marker</button>
            <button id="startARBtn" class="custom-btn disabled" disabled style="background-color: #ff9800;">Start AR Camera</button>
        </div>

        <div class="feedback">
            <p id="statusText">Status: Loading libraries...</p>
        </div>
        
        <!-- Canvas to show the OpenCV image processing -->
        <div class="canvas-container">
            <canvas id="imageCanvas"></canvas>
        </div>
    </div>

    <!-- Hidden Video element for webcam capture -->
    <video id="webcamVideo" width="640" height="480" autoplay playsinline style="display:none;"></video>
    
    <!-- Container for Three.js render output -->
    <div id="ar-container" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; display: none;">
        <!-- OpenCV will draw matched features here -->
        <canvas id="outputCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
    </div>

    <script src="main.js"></script>
</body>
</html>
