<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Tracking Web App</title>
    <link rel="stylesheet" href="app.css">

    <!-- Include OpenCV.js and Three.js -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body style="margin : 0px; overflow: hidden; background-color: #000;">

    <aside>
        <div class="sidebar-header">
            <h1>AR Features</h1>
            <p>Lab Assessment 1 - AR Tracking</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <span class="label-title">Marker Source</span>
                <label for="imageUpload" class="custom-btn btn-upload">Upload RGB Image</label>
                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            </div>

            <div class="control-group">
                <span class="label-title">Processing</span>
                <button id="generateBtn" class="custom-btn btn-generate">Generate Features</button>
                <button id="saveBtn" class="custom-btn btn-save" disabled>Save Marker</button>
            </div>

            <div class="control-group">
                <span class="label-title">Augmented Reality</span>
                <button id="startARBtn" class="custom-btn btn-ar" disabled>Start AR Camera</button>
            </div>
        </div>

        <div class="info-section">
            <p id="statusText">Status: Loading libraries...</p>
        </div>
    </aside>

    <main>
        <div class="grid-layout">
            <div class="grid-item">
                <span class="grid-label">Marker Processing</span>
                <div class="viewer-container">
                    <canvas id="imageCanvas"></canvas>
                </div>
            </div>

            <div class="grid-item">
                <span class="grid-label">Live AR View</span>
                <div class="viewer-container">
                    <div id="ar-view">
                        <canvas id="outputCanvas"></canvas>
                        <div id="ar-overlay"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="watermark">Group 4 from RTCG</div>
    </main>

    <!-- Hidden Video element for webcam capture -->
    <video id="webcamVideo" width="640" height="480" autoplay playsinline style="display:none;"></video>

    <script src="main.js"></script>
</body>

</html>
